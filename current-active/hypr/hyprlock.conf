# ==============================================================================
# Cyberpunk / Glassmorphism Hyprlock Configuration
# Dynamic Wallpaper Blur + Music Info + Modern Typography
# ==============================================================================

background {
    monitor =
    path = /home/jannik/.config/hypr/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.90
    brightness = 0.80
    vibrancy = 0.20
    vibrancy_darkness = 0.20
}

# --- Input Field ---
input-field {
    monitor = DP-1
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(197, 205, 122, 0.8)
    inner_color = rgba(20, 20, 30, 0.65)
    font_color = rgb(240, 240, 245)
    fade_on_empty = false
    placeholder_text = <i>󰌾 Enter Password...</i>
    hide_input = false
    rounding = 16
    check_color = rgba(122, 162, 247, 0.8)
    fail_color = rgba(247, 118, 142, 0.8)
    fail_text = <i>Authentication Failed!</i>
    position = 0, -80
    halign = center
    valign = center
}

# --- Big Typography Clock ---
label {
    monitor = DP-1
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 90
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# --- Date Label ---
label {
    monitor = DP-1
    text = cmd[update:1000] date +"%A, %d. %B %Y"
    color = rgba(220, 220, 235, 0.85)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 30
    halign = center
    valign = center
}

# --- Music Info Widget ---
label {
    monitor = DP-1
    text = cmd[update:2000] playerctl metadata --format "󰎆 {{title}} • {{artist}}" 2>/dev/null || echo ""
    color = rgba(197, 205, 122, 0.90)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
}

# --- Bottom System Branding ---
label {
    monitor = DP-1
    text =  Arch Nexus Workstation  •  󰌌 de
    color = rgba(160, 160, 180, 0.6)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = bottom
}
